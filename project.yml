name: Sotto
options:
  bundleIdPrefix: com.amh
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Sotto:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sotto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amh.sotto
        INFOPLIST_FILE: Sotto/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  SottoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SottoTests
    dependencies:
      - target: Sotto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amh.sottoTests
        CODE_SIGNING_ALLOWED: NO
