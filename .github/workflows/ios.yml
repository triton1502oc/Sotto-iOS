name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    name: Security & Secret Leak Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build & Test iOS App
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v5

    - name: Install XcodeGen
      run: |
        if ! command -v xcodegen &> /dev/null; then
          brew install xcodegen
        fi

    - name: Validate Release Documentation & Integrity
      run: python3 scripts/sync_release_docs.py --check

    - name: Regenerate Xcode Project
      run: xcodegen generate

    - name: Validate Swift Syntax
      run: swiftc $(find Sotto -name "*.swift") -parse

    - name: Run Unit Tests
      run: |
        DEST_ID=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}")
        if [ -n "$DEST_ID" ]; then
          echo "Running unit tests on simulator: $DEST_ID"
          xcodebuild test -project Sotto.xcodeproj -scheme SottoTests -destination "id=$DEST_ID"
        else
          echo "Falling back to generic iOS Simulator specification"
          xcodebuild test -project Sotto.xcodeproj -scheme SottoTests -destination "platform=iOS Simulator,name=iPhone 16"
        fi

    - name: Build Debug App (iOS Simulator)
      run: |
        xcodebuild build -project Sotto.xcodeproj -scheme Sotto -configuration Debug -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO

    - name: Build Release App (Verify Code Generation & Release Optimization)
      run: |
        xcodebuild build -project Sotto.xcodeproj -scheme Sotto -configuration Release -destination "generic/platform=iOS" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO SYMROOT=build/ci

    - name: Package Debug / Sideload IPA
      run: |
        mkdir -p build/ci/Payload
        cp -R build/ci/Release-iphoneos/Sotto.app build/ci/Payload/
        cd build/ci && zip -r -y Sotto-debug.ipa Payload

    - name: Upload Debug IPA
      uses: actions/upload-artifact@v4
      with:
        name: Sotto-debug
        path: build/ci/Sotto-debug.ipa
