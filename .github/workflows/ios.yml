name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      release: ${{ steps.diff.outputs.release }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Classify changed files
      id: diff
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
          files="Sotto/"
        else
          files=$(git diff --name-only "$BASE" HEAD)
        fi
        # Any change outside docs/assets requires the macOS build
        echo "code=$(echo "$files" | grep -qvE '(\.md$|^docs/|^assets/|^\.local/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
        # Release build needed when project/build config changes
        echo "release=$(echo "$files" | grep -qE '(^project\.yml$|\.xcconfig$|\.entitlements$|Info\.plist$)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  security-scan:
    name: Security & Secret Leak Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-check:
    name: Documentation Sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v5

    - name: Validate Release Documentation & Integrity
      run: python3 scripts/sync_release_docs.py --check

  build:
    name: Build & Test iOS App
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v5

    - name: Install XcodeGen
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: |
        if ! command -v xcodegen &> /dev/null; then
          brew install xcodegen
        fi

    - name: Regenerate Xcode Project
      run: xcodegen generate

    # xcodebuild test compiles the whole app, so no separate parse/Debug build is needed.
    - name: Run Unit Tests
      run: |
        DEST_ID=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}")
        if [ -n "$DEST_ID" ]; then
          echo "Running unit tests on simulator: $DEST_ID"
          xcodebuild test -project Sotto.xcodeproj -scheme SottoTests -destination "id=$DEST_ID"
        else
          echo "Falling back to generic iOS Simulator specification"
          xcodebuild test -project Sotto.xcodeproj -scheme SottoTests -destination "platform=iOS Simulator,name=iPhone 16"
        fi

  release-build:
    name: Release Build & IPA
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.release == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v5

    - name: Install XcodeGen
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: |
        if ! command -v xcodegen &> /dev/null; then
          brew install xcodegen
        fi

    - name: Regenerate Xcode Project
      run: xcodegen generate

    - name: Build Release App (Verify Code Generation & Release Optimization)
      run: |
        xcodebuild build -project Sotto.xcodeproj -scheme Sotto -configuration Release -destination "generic/platform=iOS" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO SYMROOT=build/ci

    - name: Package Sideload IPA
      run: |
        mkdir -p build/ci/Payload
        cp -R build/ci/Release-iphoneos/Sotto.app build/ci/Payload/
        cd build/ci && zip -r -y Sotto-debug.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Sotto-debug
        path: build/ci/Sotto-debug.ipa
