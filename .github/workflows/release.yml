name: Release IPA & Publish GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Release IPA & Create Release
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Validate Release Documentation & Integrity
        run: python3 scripts/sync_release_docs.py --check

      - name: Regenerate Xcode Project
        run: xcodegen generate

      - name: Build Release Application
        run: |
          xcodebuild build \
            -project Sotto.xcodeproj \
            -scheme Sotto \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT=build/release

      - name: Package Release IPA
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p build/release/Payload
          cp -R build/release/Release-iphoneos/Sotto.app build/release/Payload/
          cd build/release
          zip -r -y "Sotto-${TAG_NAME}.ipa" Payload
          echo "Successfully packaged Sotto-${TAG_NAME}.ipa"

      - name: Extract Release Notes from CHANGELOG
        id: extract_notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 -c "
          import os, re
          tag = os.environ.get('TAG_NAME', '').lstrip('v')
          if os.path.exists('CHANGELOG.md'):
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = r'## \[v?' + re.escape(tag) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
                  # Remove the ### Assets section from the body if present to avoid duplicating the GitHub release asset list
                  notes = re.sub(r'### Assets\s*\n.*?(?=\n###|\Z)', '', notes, flags=re.DOTALL).strip()
                  with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
                      out.write(notes + '\n')
          "
          if [ -f RELEASE_NOTES.md ]; then
            echo "has_notes=true" >> $GITHUB_OUTPUT
          else
            echo "has_notes=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.extract_notes.outputs.has_notes == 'true' && 'RELEASE_NOTES.md' || '' }}
          generate_release_notes: ${{ steps.extract_notes.outputs.has_notes != 'true' }}
          files: |
            build/release/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up Release Artifacts
        if: always()
        run: rm -rf build/release
